<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Irány haza!</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 100vw; height: 100vh; overflow: hidden; font-family: sans-serif; }
    #map { width: 100%; height: 100%; }

    /* ── Dialog ── */
    #dialog {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: white;
      border-radius: 18px;
      padding: 20px 24px 16px;
      box-shadow: 0 6px 28px rgba(0,0,0,0.35);
      z-index: 1000;
      max-width: 420px;
      width: 90vw;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    #dialog.show {
      opacity: 1;
      pointer-events: all;
      transform: translateX(-50%) translateY(0);
    }

    .chat-line { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
    .chat-line.isti { flex-direction: row-reverse; }

    .chat-avatar { font-size: 26px; flex-shrink: 0; line-height: 1; }

    .chat-bubble {
      padding: 9px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.55;
      max-width: 280px;
    }
    .chat-line.bmw  .chat-bubble { background: #dbeafe; border-bottom-left-radius: 4px; }
    .chat-line.isti .chat-bubble { background: #dcfce7; border-bottom-right-radius: 4px; }

    .chat-name { font-size: 11px; font-weight: bold; color: #888; margin-bottom: 3px; }

    #go-btn {
      display: block;
      margin: 4px auto 0;
      padding: 10px 32px;
      background: #1d70b8;
      color: white;
      border: none;
      border-radius: 22px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s;
    }
    #go-btn:hover { background: #145591; }

    /* ── Welcome overlay ── */
    #welcome {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    #welcome.show { display: flex; }
    #welcome-inner {
      display: inline-flex;
      flex-direction: column;
      align-items: stretch;
      max-width: 40vw;
      animation: pop 0.45s cubic-bezier(.17,.67,.38,1.3);
    }
    #welcome-banner {
      background: #fde68a;
      border: 2px solid #f59e0b;
      border-radius: 12px 12px 0 0;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      color: #92400e;
      text-align: center;
      box-sizing: border-box;
      word-wrap: break-word;
      white-space: normal;
    }
    #welcome img {
      max-width: 40vw;
      max-height: 40vh;
      border-radius: 0 0 16px 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      display: block;
    }
    @keyframes pop {
      from { transform: scale(0.55); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }
  </style>
</head>
<body>

<div id="map"></div>

<!-- Dialog -->
<div id="dialog">
  <div class="chat-line bmw">
    <div class="chat-avatar">🚗</div>
    <div>
      <div class="chat-name">BMW</div>
      <div class="chat-bubble">Szia Isti, hosszú volt a nap mi? Menjünk haza?</div>
    </div>
  </div>
  <div class="chat-line isti">
    <div class="chat-avatar">🙋</div>
    <div>
      <div class="chat-name">Isti</div>
      <div class="chat-bubble">Igen és még a megígért mazsolámat sem kaptam meg, irány haza!</div>
    </div>
  </div>
  <button id="go-btn">Irány haza! 🚗</button>
</div>

<!-- Welcome overlay -->
<div id="welcome" onclick="this.classList.remove('show')">
  <div id="welcome-inner">
    <div id="welcome-banner">☀️ Üdvözöllek szomszéd, milyen szépen süt itt a nap ma a Pápay parkban. Már meg is rendeltem a pizzádat, fél óra múlva jön!</div>
    <img src="welcome.png" alt="Üdvözlünk otthon!" />
  </div>
</div>

<script>
  const START = [47.5629, 19.0541];
  const END   = [47.4739, 19.0722];

  // Simplified route through Budapest (Óbuda → IX. kerület)
  const ROUTE = [
    [47.5629, 19.0541],
    [47.5480, 19.0515],
    [47.5300, 19.0540],
    [47.5100, 19.0575],
    [47.4960, 19.0620],
    [47.4860, 19.0672],
    [47.4739, 19.0722]
  ];

  // ── Map ────────────────────────────────────────────────
  const map = L.map('map', { zoomControl: false })
    .setView(START, 16);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19
  }).addTo(map);

  // ── BMW marker ─────────────────────────────────────────
  const bmwIcon = L.icon({
    iconUrl: 'mosolybmw.png',
    iconSize: [90, 68],
    iconAnchor: [45, 34]
  });
  const bmwMarker = L.marker(START, { icon: bmwIcon, zIndexOffset: 1000 }).addTo(map);

  // ── Destination marker ─────────────────────────────────
  const homeIcon = L.divIcon({
    className: '',
    html: `<div style="font-size:28px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5));">🏠</div>`,
    iconSize: [32, 32], iconAnchor: [16, 32]
  });

  // ── Step 1: show dialog after brief zoom-in pause ──────
  setTimeout(() => {
    document.getElementById('dialog').classList.add('show');
  }, 1000);

  // ── Step 2: "Irány haza!" clicked ─────────────────────
  document.getElementById('go-btn').addEventListener('click', () => {
    document.getElementById('dialog').classList.remove('show');
    setTimeout(zoomOutAndDrive, 400);
  });

  function zoomOutAndDrive() {
    const bounds = L.latLngBounds([START, END]).pad(0.12);
    map.flyToBounds(bounds, { duration: 2.2, easeLinearity: 0.4 });
    setTimeout(() => {
      L.marker(END, { icon: homeIcon }).addTo(map);
      drawLine();
    }, 2600);
  }

  // ── Animated line then car ─────────────────────────────
  function drawLine() {
    const pts = interpolate(ROUTE, 80);
    const line = L.polyline([], {
      color: '#1d70b8', weight: 4, opacity: 0.85,
      dashArray: null
    }).addTo(map);

    let i = 0;
    const timer = setInterval(() => {
      line.addLatLng(pts[i]);
      i++;
      if (i >= pts.length) {
        clearInterval(timer);
        setTimeout(driveCar, 200);
      }
    }, 25);
  }

  function driveCar() {
    const pts = interpolate(ROUTE, 300);
    let i = 0;
    const timer = setInterval(() => {
      bmwMarker.setLatLng(pts[i]);
      // Rotate icon direction (optional visual touch via CSS not easily done in Leaflet, skip)
      i++;
      if (i >= pts.length) {
        clearInterval(timer);
        setTimeout(() => document.getElementById('welcome').classList.add('show'), 700);
      }
    }, 35);
  }

  // ── Interpolation helper ───────────────────────────────
  function interpolate(pts, steps) {
    const segs = [];
    let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const d = Math.hypot(pts[i][0] - pts[i+1][0], pts[i][1] - pts[i+1][1]);
      segs.push(d); total += d;
    }
    const result = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const n = Math.max(2, Math.round((segs[i] / total) * steps));
      for (let j = 0; j < n; j++) {
        const t = j / n;
        result.push([
          pts[i][0] + t * (pts[i+1][0] - pts[i][0]),
          pts[i][1] + t * (pts[i+1][1] - pts[i][1])
        ]);
      }
    }
    result.push(pts[pts.length - 1]);
    return result;
  }
</script>
</body>
</html>
