<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Irány haza!</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 100vw; height: 100vh; overflow: hidden; font-family: sans-serif; }
    #map { width: 100%; height: 100%; }

    /* ── Dialogs ── */
    .dialog-box {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: white;
      border-radius: 18px;
      padding: 20px 24px 16px;
      box-shadow: 0 6px 28px rgba(0,0,0,0.35);
      z-index: 1000;
      max-width: 420px;
      width: 90vw;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .dialog-box.show {
      opacity: 1;
      pointer-events: all;
      transform: translateX(-50%) translateY(0);
    }

    .chat-line { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
    .chat-line.isti { flex-direction: row-reverse; }

    .chat-avatar { font-size: 26px; flex-shrink: 0; line-height: 1; }
    .chat-bubble {
      padding: 9px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.55;
      max-width: 280px;
    }
    .chat-line.bmw  .chat-bubble { background: #dbeafe; border-bottom-left-radius: 4px; }
    .chat-line.max  .chat-bubble { background: #fee2e2; border-bottom-left-radius: 4px; }
    .chat-line.isti .chat-bubble { background: #dcfce7; border-bottom-right-radius: 4px; }
    .chat-name { font-size: 11px; font-weight: bold; color: #888; margin-bottom: 3px; }

    .dialog-btn {
      display: block;
      margin: 4px auto 0;
      padding: 10px 32px;
      color: white;
      border: none;
      border-radius: 22px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s;
    }
    #go-btn   { background: #1d70b8; }
    #go-btn:hover   { background: #145591; }
    #race-btn { background: #dc2626; }
    #race-btn:hover { background: #b91c1c; }

    /* ── Welcome overlay ── */
    #welcome {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    #welcome.show { display: flex; }
    #welcome-inner {
      display: inline-flex;
      flex-direction: column;
      align-items: stretch;
      max-width: 40vw;
      animation: pop 0.45s cubic-bezier(.17,.67,.38,1.3);
    }
    #welcome-banner {
      background: #fde68a;
      border: 2px solid #f59e0b;
      border-radius: 12px 12px 0 0;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      color: #92400e;
      text-align: center;
      box-sizing: border-box;
      word-wrap: break-word;
      white-space: normal;
    }
    #welcome img {
      max-width: 40vw;
      max-height: 40vh;
      border-radius: 0 0 16px 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      display: block;
    }
    @keyframes pop {
      from { transform: scale(0.55); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }
  </style>
</head>
<body>

<div id="map"></div>

<!-- Dialog 1: BMW + Isti -->
<div id="dialog1" class="dialog-box">
  <div class="chat-line bmw">
    <div class="chat-avatar">🚗</div>
    <div>
      <div class="chat-name">BMW</div>
      <div class="chat-bubble">Szia Isti, hosszú volt a nap mi? Menjünk haza?</div>
    </div>
  </div>
  <div class="chat-line isti">
    <div class="chat-avatar">🙋</div>
    <div>
      <div class="chat-name">Isti</div>
      <div class="chat-bubble">Igen és még a megígért mazsolámat sem kaptam meg, irány haza!</div>
    </div>
  </div>
  <button id="go-btn" class="dialog-btn">Irány haza! 🚗</button>
</div>

<!-- Dialog 2: MAX kihívás -->
<div id="dialog2" class="dialog-box">
  <div class="chat-line max">
    <div class="chat-avatar">🏎️</div>
    <div>
      <div class="chat-name">MAX</div>
      <div class="chat-bubble">Verseny hazáig? 😏</div>
    </div>
  </div>
  <div class="chat-line isti">
    <div class="chat-avatar">🙋</div>
    <div>
      <div class="chat-name">Isti</div>
      <div class="chat-bubble">Naná, nyomjuk! 🏁</div>
    </div>
  </div>
  <button id="race-btn" class="dialog-btn">Rajt! 🏁</button>
</div>

<!-- Welcome overlay -->
<div id="welcome" onclick="this.classList.remove('show')">
  <div id="welcome-inner">
    <div id="welcome-banner">☀️ Üdvözöllek szomszéd, milyen szépen süt itt a nap ma a Pápay parkban. Már meg is rendeltem a pizzádat, fél óra múlva jön!</div>
    <img src="welcome.png" alt="Üdvözlünk otthon!" />
  </div>
</div>

<script>
  const START = [47.5629, 19.0541];
  const END   = [47.4739, 19.0722];

  const ROUTE = [
    [47.5629, 19.0541],
    [47.5480, 19.0515],
    [47.5300, 19.0540],
    [47.5100, 19.0575],
    [47.4960, 19.0620],
    [47.4860, 19.0672],
    [47.4739, 19.0722]
  ];

  // ── Map ───────────────────────────────────────────────
  const map = L.map('map', { zoomControl: false }).setView(START, 16);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19
  }).addTo(map);

  // ── Icons ─────────────────────────────────────────────
  const bmwIcon = L.icon({ iconUrl: 'mosolybmw.png', iconSize: [90, 68], iconAnchor: [45, 34] });
  const maxIcon = L.icon({ iconUrl: 'maxi.png',      iconSize: [90, 68], iconAnchor: [45, 34] });
  const homeIcon = L.divIcon({
    className: '',
    html: `<div style="font-size:28px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5));">🏠</div>`,
    iconSize: [32, 32], iconAnchor: [16, 32]
  });

  // ── Markers ───────────────────────────────────────────
  const bmwMarker = L.marker(START, { icon: bmwIcon, zIndexOffset: 1000 }).addTo(map);
  let maxMarker = null;

  // ── Step 1: show Dialog 1 ─────────────────────────────
  setTimeout(() => document.getElementById('dialog1').classList.add('show'), 1000);

  // ── Step 2: "Irány haza!" → spawn MAX, show Dialog 2 ──
  document.getElementById('go-btn').addEventListener('click', () => {
    document.getElementById('dialog1').classList.remove('show');
    setTimeout(() => {
      // Place MAX slightly offset from BMW so both visible
      maxMarker = L.marker([START[0] - 0.0003, START[1] + 0.0009], { icon: maxIcon, zIndexOffset: 900 }).addTo(map);
      document.getElementById('dialog2').classList.add('show');
    }, 400);
  });

  // ── Step 3: "Rajt!" → zoom out, draw line, race! ──────
  document.getElementById('race-btn').addEventListener('click', () => {
    document.getElementById('dialog2').classList.remove('show');
    setTimeout(zoomOutAndRace, 400);
  });

  function zoomOutAndRace() {
    const bounds = L.latLngBounds([START, END]).pad(0.12);
    map.flyToBounds(bounds, { duration: 2.2, easeLinearity: 0.4 });
    setTimeout(() => {
      L.marker(END, { icon: homeIcon }).addTo(map);
      drawLine();
    }, 2600);
  }

  // ── Animated route line ───────────────────────────────
  function drawLine() {
    const pts = interpolate(ROUTE, 80);
    const line = L.polyline([], { color: '#1d70b8', weight: 4, opacity: 0.85 }).addTo(map);
    let i = 0;
    const timer = setInterval(() => {
      line.addLatLng(pts[i++]);
      if (i >= pts.length) { clearInterval(timer); setTimeout(race, 200); }
    }, 25);
  }

  // ── Race animation ────────────────────────────────────
  function race() {
    const STEPS = 300;
    const pts = interpolate(ROUTE, STEPS);
    let bmwStep = 0;
    let maxStep = 0;
    let maxDone = false;
    const GIVEUP_AT = Math.floor(STEPS * 0.55);

    const timer = setInterval(() => {
      // BMW advances every tick
      if (bmwStep < pts.length) {
        bmwMarker.setLatLng(pts[bmwStep]);
        bmwStep++;
      }

      // MAX advances every 2nd tick (falls behind)
      if (!maxDone && bmwStep % 2 === 0 && maxStep < pts.length) {
        maxMarker.setLatLng(pts[maxStep]);
        maxStep++;
      }

      // MAX gives up when BMW is 2/3 done
      if (!maxDone && bmwStep >= GIVEUP_AT) {
        maxDone = true;
        maxGivesUp(pts[maxStep]);
      }

      // BMW finishes
      if (bmwStep >= pts.length) {
        clearInterval(timer);
        setTimeout(() => document.getElementById('welcome').classList.add('show'), 500);
      }
    }, 35);
  }

  function maxGivesUp(currentPos) {
    // Show "Feladom!" popup above MAX
    maxMarker.bindPopup(
      `<div style="font-size:15px;font-weight:bold;text-align:center;">🏳️ Feladom!<br/><span style="font-size:12px;font-weight:normal;">Nem bírom tartani a tempót...</span></div>`,
      { closeButton: false, minWidth: 160 }
    ).openPopup();

    // After 1.8s close popup and drift right + fade out
    setTimeout(() => {
      maxMarker.closePopup();
      const el = maxMarker.getElement();
      if (el) {
        el.style.transition = 'transform 1.6s ease-in, opacity 1.6s ease-in';
        el.style.transform = 'translateX(320px)';
        el.style.opacity = '0';
      }
      setTimeout(() => { if (maxMarker) { maxMarker.remove(); maxMarker = null; } }, 1700);
    }, 1800);
  }

  // ── Interpolation helper ──────────────────────────────
  function interpolate(pts, steps) {
    const segs = []; let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const d = Math.hypot(pts[i][0]-pts[i+1][0], pts[i][1]-pts[i+1][1]);
      segs.push(d); total += d;
    }
    const result = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const n = Math.max(2, Math.round((segs[i] / total) * steps));
      for (let j = 0; j < n; j++) {
        const t = j / n;
        result.push([
          pts[i][0] + t * (pts[i+1][0] - pts[i][0]),
          pts[i][1] + t * (pts[i+1][1] - pts[i][1])
        ]);
      }
    }
    result.push(pts[pts.length - 1]);
    return result;
  }
</script>
</body>
</html>
